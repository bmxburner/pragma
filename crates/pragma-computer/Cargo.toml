[package]
name = "pragma-computer"
version = "1.3.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Native computer-use backends for Pragma (accessibility, capture, synthetic input) and the `pragma-computer` helper process that pragma-server supervises."

[lints]
workspace = true

[[bin]]
name = "pragma-computer"
path = "src/bin/pragma-computer.rs"

[dependencies]
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pragma-constants = { path = "../../packages/constants" }
pragma-core = { path = "../pragma-core" }
pragma-platform = { path = "../pragma-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
xcap = { version = "0.6", features = ["image"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSRunningApplication",
  "NSWorkspace",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "HIServices",
  "AXError",
  "AXUIElement",
  "AXValue",
  "AXValueConstants",
  "libc",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFBase",
  "CFCGTypes",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
  "CGRemoteOperation",
  "CGWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
  "NSURL",
] }

[dev-dependencies]
tempfile = "3"
